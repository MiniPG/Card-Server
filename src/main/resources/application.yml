spring:
  application:
    name: Card-Server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3307/card?serverTimezone=Asia/Seoul
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8081

card:
  latency-ms: 500
  reject-rate: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

logging:
  file:
    name: ${LOG_DIR:logs}/card-server.log
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
