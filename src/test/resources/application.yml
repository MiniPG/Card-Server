spring:
  datasource:
    url: jdbc:tc:mysql:8.0:///card?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  jpa:
    hibernate:
      ddl-auto: create-drop

card:
  latency-ms: 0
  reject-rate: 0.0
